<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <h1>Quiz App</h1>
      <main>
        <article class="Question Card">
          <button class="bookmark">
            <img src="./assets/bookmark.svg" alt="Bookmark" />
          </button>
          <h2>
            What is the name of the powerful artifact that Thanos seeks to
            collect in the MCU?
          </h2>
          <p class="answer" hidden>Answer</p>
          <button class="toggle">Show Answer</button>
          <ul class="tags">
            <li class="tag">Marvel</li>
            <li class="tag">Thanos</li>
            <li class="tag">Artifacts</li>
          </ul>
        </article>
      </main>
    </header>
  </body>
</html>
